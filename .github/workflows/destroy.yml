name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID"
        required: true
        type: string
      environment:
        description: "Environment (dev or prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      ref:
        description: "Git ref (commit/branch) to checkout (defaults to base)"
        required: false
        default: ""
      dry_run:
        description: "If true, skip terraform destroy (for testing)"
        required: false
        default: "false"

concurrency:
  group: payments-terraform-${{ inputs.environment || 'dev' }}-${{ inputs.request_id }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'nonprod' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    defaults:
      run:
        working-directory: envs/${{ env.ENVIRONMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::420259807324:role/tfplan-connector
          aws-region: eu-west-2
          role-session-name: tfplan-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug context
        run: |
          set -euxo pipefail
          aws sts get-caller-identity
          terraform version
          pwd
          ls -la

      - name: Terraform Init
        run: |
          set -euxo pipefail
          terraform init -input=false \
            -backend-config="bucket=tfpilot-tfstate-payments-${{ env.ENVIRONMENT }}" \
            -backend-config="key=tfpilot-tfstate-payments-${{ env.ENVIRONMENT }}/envs/${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=eu-west-2" \
            -backend-config="dynamodb_table=tfpilot-tfstate-lock-payments-${{ env.ENVIRONMENT }}" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy (target module)
        run: |
          set -euxo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run enabled; skipping destroy"
            exit 0
          fi
          terraform destroy -input=false -auto-approve -lock-timeout=300s -target="module.tfpilot_${{ inputs.request_id }}"

      - name: Upload destroy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destroy-logs
          path: |
            envs/${{ inputs.environment }}/.terraform.lock.hcl
